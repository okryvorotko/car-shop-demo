name: Application CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out application
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build and start application
        run: docker compose up --build --detach

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://localhost:4000/ping >/dev/null \
              && curl --fail --silent --show-error --max-time 5 http://localhost:3000 >/dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application ($attempt/30)..."
            sleep 5
          done
          echo "Application did not become ready" >&2
          exit 1

      - name: Capture container logs
        if: failure()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: docker-compose-logs
          path: docker-compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans
