version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules  # prevent overwriting node_modules with host empty folder
    command: npm run dev  # use nodemon for backend auto-reload

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev  # use vite dev server

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: carshop
      POSTGRES_PASSWORD: carshop
      POSTGRES_DB: carshop
    ports:
      - "5432:5432"
